[project]
name = "vidyaai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "langchain",
    "langchain-openai",
    "redis>=5.0.0",
    "pinecone-text",
    "pinecone",
    "beanie",
    "motor",
    "python-dotenv>=1.2.1",
    "git-filter-repo>=2.47.0",
    "tiktoken",
    "fasttext-wheel>=0.9.2",
    "numpy<2.0",
    "httpx>=0.28.1",
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
