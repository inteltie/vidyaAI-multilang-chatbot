services:
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-app
    depends_on:

      redis:
        condition: service_healthy
    env_file:
      - .env # This reads all variables from .env file
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8001:8001"
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s



  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 100s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  backend:


volumes:

  redis_data:
